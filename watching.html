<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Watchlist - TV Tracker</title>

<link rel="stylesheet" href="style.css">

<style>

    .watchlist-container {
        width: 90%;
        max-width: 1200px;
        margin: 50px auto;
    }


    .watchlist-title {
        font-size: 48px;
        color: var(--accent);
        margin-bottom: 10px;
    }


    .watchlist-subtitle {
        color: #aaa;
        font-size: 18px;
        margin-bottom: 40px;
    }


    .watchlist {
        display: flex;
        flex-direction: column;
        gap: 25px;
    }


    .watch-card {
        display: flex;
        gap: 25px;

        background: #171b25;

        border-radius: 15px;

        overflow: hidden;

        box-shadow:
            0 0 15px rgba(0, 0, 0, .3);

        transition: .25s;
    }


    .watch-card:hover {
        transform: translateY(-3px);
    }


    .watch-poster {
        width: 220px;
        min-width: 220px;
        height: 320px;

        object-fit: cover;
    }


    .watch-placeholder {
        width: 220px;
        min-width: 220px;
        height: 320px;

        display: flex;
        align-items: center;
        justify-content: center;

        background: #1f2532;

        font-size: 60px;
    }


    .watch-info {
        flex: 1;
        padding: 25px;
    }


    .watch-info h2 {
        margin-bottom: 8px;
    }


    .watch-meta {
        color: #aaa;
        margin-bottom: 8px;
    }


    .watch-progress-text {
        color: #ccc;
        margin-top: 10px;
    }


    .watch-progress {
        width: 100%;
        height: 12px;

        background: #2c3445;

        border-radius: 10px;

        overflow: hidden;

        margin: 18px 0 5px;
    }


    .watch-progress-fill {
        height: 100%;
        background: var(--accent);

        transition: width .3s;
    }


    .watch-buttons {
        display: flex;
        gap: 10px;

        flex-wrap: wrap;

        margin-top: 25px;
    }


    .watch-buttons button {
        background: var(--accent);

        color: white;

        border: none;

        padding: 11px 17px;

        border-radius: 8px;

        cursor: pointer;

        transition: .25s;

        font-size: 15px;
    }


    .watch-buttons button:hover {
        filter: brightness(.9);
    }


    .watch-buttons .remove-button {
        background: #d63031;
    }


    .watch-buttons .remove-button:hover {
        background: #b71c1c;
    }


    .empty-watchlist {
        text-align: center;

        background: #171b25;

        padding: 60px 30px;

        border-radius: 15px;

        color: #aaa;
    }


    .empty-watchlist h2 {
        color: white;

        margin-bottom: 12px;
    }


    .empty-watchlist p {
        margin-bottom: 25px;
    }


    .home-button {
        display: inline-block;

        background: var(--accent);

        color: white;

        text-decoration: none;

        padding: 12px 22px;

        border-radius: 8px;

        transition: .25s;
    }


    .home-button:hover {
        filter: brightness(.9);
    }


    /* LIGHT MODE */

    body.light .watch-card,
    body.light .empty-watchlist {
        background: white;
        color: #111;
    }


    body.light .empty-watchlist h2 {
        color: #111;
    }


    /* MOBILE */

    @media (max-width: 700px) {

        .watchlist-container {
            width: 92%;
            margin: 30px auto;
        }


        .watchlist-title {
            font-size: 38px;
        }


        .watch-card {
            flex-direction: column;
        }


        .watch-poster,
        .watch-placeholder {
            width: 100%;
            min-width: 0;
            height: 350px;
        }


        .watch-info {
            padding: 20px;
        }


        .watch-buttons {
            flex-direction: column;
        }


        .watch-buttons button {
            width: 100%;
        }

    }

</style>

</head>
